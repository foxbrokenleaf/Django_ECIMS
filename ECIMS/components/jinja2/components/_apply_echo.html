{# 回执页底部信息块：展示「表单 POST → redirect() → 回执页 GET」的处理链路 #}
<div class="card border-0 shadow-sm mt-3" id="apply-response-echo">
    <div class="card-body py-3 d-flex flex-wrap align-items-center gap-3 small text-muted">
        <span class="fw-semibold text-dark">
            <i class="bi bi-broadcast text-primary me-1"></i>本次处理流程（POST-Redirect-GET）
        </span>
        <span>
            提交
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle">POST</span>
            →
            <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">302 Found</span>
            →
            回执
            <span class="badge bg-success-subtle text-success border border-success-subtle">
                {{ response_status }} OK
            </span>
        </span>
        <span><code>redirect("components:apply_result", pk={{ record.pk }})</code></span>
        <span>Cookie <code>{{ apply_cookie_name }}={{ record.apply_no }}</code></span>
        <span class="ms-auto">回执页由 <code>ApplyResultView</code> 渲染</span>
    </div>
</div>
